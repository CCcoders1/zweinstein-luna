<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style id="kritiek">html,body{background:#120c06;color:#f4e4c1;margin:0}html{background:#120c06!important}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(90,55,12,.45),transparent 55%),#120c06;color:#f4e4c1;text-align:center;padding:24px;transition:opacity .45s ease}
#splash .splashkaarsen{display:flex;gap:22px;margin-bottom:22px}
#splash .kaars{width:10px;height:42px;border-radius:4px 4px 2px 2px;background:linear-gradient(#f4e4c1,#c9a06a);position:relative;box-shadow:0 0 16px rgba(255,180,60,.35)}
#splash .kaars:before{content:"";position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:8px;height:12px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 40% 30%,#fff6c8,#ffb03a 55%,#d06010);box-shadow:0 0 14px 4px rgba(255,170,50,.7);animation:splashvlam 1.2s ease-in-out infinite alternate}
#splash .kaars:nth-child(2):before{animation-delay:.3s}
#splash .kaars:nth-child(3):before{animation-delay:.6s}
@keyframes splashvlam{from{transform:translateX(-50%) scale(.9);opacity:.85}to{transform:translateX(-50%) scale(1.08);opacity:1}}
#splash p{margin:0;font-family:Georgia,serif;font-size:18px;letter-spacing:.02em}
#splash .splashsub{margin-top:8px;font-size:14px;opacity:.75}
html.klaar #splash{opacity:0;pointer-events:none}
#sterren,header,main,nav,#toast{opacity:0}
html.klaar #sterren,html.klaar header,html.klaar main,html.klaar nav,html.klaar #toast{opacity:1;transition:opacity .7s ease}
@media(prefers-reduced-motion:reduce){html.klaar #sterren,html.klaar header,html.klaar main,html.klaar nav,html.klaar #toast,#splash{transition:opacity .4s linear}#splash .kaars:before{animation:none}}
</style>
<title>Zweinstein – Magische Reis</title>
<meta name="theme-color" content="#0c1124"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="img/icoon-192.png"><link rel="apple-touch-icon" href="img/icoon-192.png">
<link rel="stylesheet" href="bundel.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="bundel.css"></noscript>
<script>try{if(JSON.parse(localStorage.getItem("zweinstein_v1")||"{}").groteTekst)document.documentElement.classList.add("groottekst")}catch(e){}</script>
<script src="bundel.js" defer></script>
</head>
<body class="huis-geen">
<div id="splash" aria-live="polite">
  <div class="splashkaarsen" aria-hidden="true"><span class="kaars"></span><span class="kaars"></span><span class="kaars"></span></div>
  <p>Even de kaarsen aansteken…</p>
  <p class="splashsub">Welkom terug in het kasteel</p>
</div>
<div id="sterren"></div>
<header><div id="logo" title="Zweinstein">🏰 <span>Zweinstein</span></div>
<div id="stats"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
</body></html>
